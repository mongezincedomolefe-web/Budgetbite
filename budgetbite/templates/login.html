{% extends "base.html" %}
{% block title %}Log In · BudgetBite{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="brand">🍽️ BudgetBite</h1>
    <p class="subtitle">Log in to track your spending.</p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-check">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn-primary">Log In</button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
